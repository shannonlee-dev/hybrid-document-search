name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.2"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff format check
        run: uv run --locked ruff format --check .
      - run: uv run --locked pytest

  dense-tests:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.2"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --extra dense
      - run: uv run --locked --extra dense pytest tests/dense

  fusion-tests:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history: removed v1 evidence files are verified from git.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.2"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --extra sparse --extra dense
      - run: uv run --locked --extra sparse --extra dense python -c "import numpy, faiss, bm25s, sklearn"
      - run: uv run --locked --extra sparse --extra dense pytest tests/fusion -q
      # Evidence checks that need scipy (via scikit-learn) and faiss; the base job skips them.
      - run: >-
          uv run --locked --extra sparse --extra dense pytest -q
          tests/test_strategyqa_regression_evidence.py
          tests/test_finance_service_evidence.py
          tests/test_tie_sensitivity.py
