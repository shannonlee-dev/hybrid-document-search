[project]
name = "hybrid-document-search"
version = "0.1.0"
description = "Compare sparse, dense, and hybrid document retrieval."
requires-python = ">=3.12"
dependencies = ["fastapi", "pydantic", "uvicorn", "streamlit"]

[project.optional-dependencies]
sparse = ["scikit-learn", "bm25s"]
dense = ["sentence-transformers", "faiss-cpu", "numpy"]
evaluation = ["ranx"]
# Exploratory downstream RAG evaluation only; not needed by the API or UI.
# langchain-community 0.4.2 removed a module that ragas 0.4.3 imports.
rag = ["ragas==0.4.3", "openai", "langchain-community<0.4.2"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "retrievers", "fusion", "evaluation", "indexing", "data", "frontend"]

[tool.hatch.build.targets.wheel.force-include]
"config/dense_models.toml" = "config/dense_models.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
